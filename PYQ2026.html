<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Urdu Guess Paper 2026 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #e0e5ec;
    --light: #ffffff;
    --dark: #a3b1c6;
    --text: #39445a;
    --accent: #5b6ef5;
    --green: #2ed573;
    --red: #ff4757;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Nastaliq Urdu', sans-serif; }
body { 
    background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; 
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
}
h1, h2, h3 { text-align: center; margin-top: 0; }
.hidden { display: none !important; }

/* Neomorphic Base */
.neo-box {
    background: var(--bg); border-radius: 20px; padding: 20px; width: 100%; max-width: 700px;
    box-shadow: 8px 8px 16px var(--dark), -8px -8px 16px var(--light);
    margin-bottom: 20px;
}
.neo-btn {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 15px; 
    background: var(--bg); color: var(--accent); font-weight: 600; font-size: 16px; cursor: pointer;
    box-shadow: 6px 6px 12px var(--dark), -6px -6px 12px var(--light); transition: .1s;
}
.neo-btn:active { box-shadow: inset 4px 4px 8px var(--dark), inset -4px -4px 8px var(--light); transform: scale(0.98); }
.neo-btn-primary { color: #fff; background: linear-gradient(135deg, #7b8fff, #5b6ef5); box-shadow: 6px 6px 12px var(--dark), -6px -6px 12px var(--light); }

/* Quiz Screen */
.q-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 15px; font-weight: 600; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; border-bottom: 2px solid var(--dark); }
.q-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.8; }
.opt-btn {
    display: block; width: 100%; text-align: right; padding: 12px; margin-bottom: 10px;
    border: none; border-radius: 12px; background: var(--bg); color: var(--text); font-size: 16px; cursor: pointer;
    box-shadow: 4px 4px 8px var(--dark), -4px -4px 8px var(--light); transition: .1s;
}
.opt-btn.selected {
    box-shadow: inset 4px 4px 8px var(--dark), inset -4px -4px 8px var(--light);
    color: var(--accent); font-weight: bold;
}

/* Result Screen */
.result-card { border-right: 6px solid #ccc; padding: 15px; margin-bottom: 15px; background: var(--bg); border-radius: 10px; box-shadow: 4px 4px 8px var(--dark), -4px -4px 8px var(--light); }
.result-card.correct { border-right-color: var(--green); }
.result-card.wrong { border-right-color: var(--red); }
.rs-ans { font-size: 14px; margin-top: 8px; }
.rs-correct-text { color: var(--green); font-weight: bold; }
.rs-wrong-text { color: var(--red); font-weight: bold; }
.rs-reason { font-size: 13px; color: #555; margin-top: 5px; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 5px; }

/* Rank Screen */
.rank-item {
    display: flex; justify-content: space-between; padding: 12px; margin-bottom: 10px;
    border-radius: 10px; box-shadow: 4px 4px 8px var(--dark), -4px -4px 8px var(--light); font-weight: 600;
}
.rank-1 { color: #d4af37; } /* Gold */
.rank-2 { color: #aaa9ad; } /* Silver */
.rank-3 { color: #cd7f32; } /* Bronze */
</style>
</head>
<body>

<!-- Start Screen (Without Name Input) -->
<div id="startScreen" class="neo-box">
    <h2>Urdu Guess Paper Quiz 2026</h2>
    <p style="text-align:center; font-size:15px; margin-bottom:30px;">ٹیسٹ شروع کرنے کے لیے نیچے بٹن دبائیں</p>
    <button class="neo-btn neo-btn-primary" onclick="startQuiz()">ٹیسٹ شروع کریں (100 سوالات)</button>
</div>

<!-- Quiz Screen -->
<div id="quizScreen" class="hidden">
    <div class="neo-box" style="max-width: 700px;">
        <div class="q-header">
            <span id="qProgress">سوال 1 / 100</span>
            <span id="qScore">اسکور: 0</span>
        </div>
        <div id="quizContent" style="max-height: 65vh; overflow-y: auto; padding-left: 10px;"></div>
        <button class="neo-btn neo-btn-primary" style="margin-top: 20px;" onclick="submitQuiz()">ٹیسٹ جمع کریں</button>
    </div>
</div>

<!-- Result Screen -->
<div id="resultScreen" class="hidden">
    <div class="neo-box" style="text-align: center;">
        <h2>آپ کا نتیجہ</h2>
        <h1 id="finalScore" style="color: var(--accent); font-size: 40px;">0 / 100</h1>
        <button class="neo-btn" onclick="showRankScreen()">رینک لسٹ دیکھیں 🏆</button>
        <button class="neo-btn" style="margin-top:10px; color: var(--text);" onclick="location.reload()">دوبارہ کھیلیں</button>
    </div>
    <div id="reviewArea" style="max-width: 700px;"></div>
</div>

<!-- Rank Screen -->
<div id="rankScreen" class="hidden">
    <div class="neo-box" style="max-width: 600px;">
        <h2>🏆 Rank List 🏆</h2>
        <div id="rankList"></div>
        <button class="neo-btn" style="margin-top: 20px; color: var(--text);" onclick="location.reload()">واپس جائیں</button>
    </div>
</div>

let currentUser = "";
let userAnswers = [];
let currentScore = 0;

function startQuiz() {
    // Auto-generate a random student name for the rank list
    currentUser = "طالب علم " + Math.floor(1000 + Math.random() * 9000);
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    
    userAnswers = new Array(quizData.length).fill(null);
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('quizContent');
    container.innerHTML = '';
    
    quizData.forEach((item, index) => {
        const div = document.createElement('div');
        div.style.marginBottom = '25px';
        div.innerHTML = `<div class="q-text">${index + 1}. ${item.q}</div>`;
        
        item.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(index, optIndex, btn, div);
            div.appendChild(btn);
        });
        container.appendChild(div);
    });
}

function selectOption(qIndex, oIndex, btn, parentDiv) {
    userAnswers[qIndex] = oIndex;
    const siblings = parentDiv.querySelectorAll('.opt-btn');
    siblings.forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
}

function submitQuiz() {
    if(userAnswers.includes(null)) {
        if(!confirm("آپ نے کچھ سوالات کے جوابات نہیں دیے۔ کیا آپ پھر بھی جمع کرنا چاہتے ہیں؟")) return;
    }

    currentScore = 0;
    const reviewArea = document.getElementById('reviewArea');
    reviewArea.innerHTML = '<h3 style="text-align:center; margin-top:30px;">جوابات کی جانچ پڑتال</h3>';

    quizData.forEach((item, index) => {
        const isCorrect = userAnswers[index] === item.correct;
        if (isCorrect) currentScore++;

        const card = document.createElement('div');
        card.className = `result-card ${isCorrect ? 'correct' : 'wrong'}`;
        
        let html = `<div style="font-weight:bold; margin-bottom:10px;">${index+1}. ${item.q}</div>`;
        html += `<div class="rs-ans">آپ کا جواب: <span class="${isCorrect ? 'rs-correct-text' : 'rs-wrong-text'}">${userAnswers[index] !== null ? item.options[userAnswers[index]] : 'نہیں دیا'}</span></div>`;
        
        if (!isCorrect) {
            html += `<div class="rs-ans">صحیح جواب: <span class="rs-correct-text">${item.options[item.correct]}</span></div>`;
        }
        html += `<div class="rs-reason">💡 ${item.reason}</div>`;
        
        card.innerHTML = html;
        reviewArea.appendChild(card);
    });

    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = `${currentScore} / ${quizData.length}`;

    saveScore(currentUser, currentScore, quizData.length);
}

function saveScore(name, score, total) {
    let leaderboard = JSON.parse(localStorage.getItem('urduQuizRanks100')) || [];
    leaderboard.push({ name: name, score: score, total: total, date: new Date().toLocaleDateString() });
    leaderboard.sort((a, b) => b.score - a.score);
    leaderboard = leaderboard.slice(0, 50);
    localStorage.setItem('urduQuizRanks100', JSON.stringify(leaderboard));
}

function showRankScreen() {
    const password = prompt("رینک لسٹ دیکھنے کے لیے پاس ورڈ درج کریں:");
    if (password !== "@1234") {
        alert("غلط پاس ورڈ!");
        return;
    }

    const leaderboard = JSON.parse(localStorage.getItem('urduQuizRanks100')) || [];
    const listDiv = document.getElementById('rankList');
    listDiv.innerHTML = '';

    if(leaderboard.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center;">ابھی کوئی ریکارڈ موجود نہیں ہے۔</p>';
    } else {
        leaderboard.forEach((entry, index) => {
            let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
            let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1) + '.';
            
            const div = document.createElement('div');
            div.className = `rank-item ${rankClass}`;
            div.innerHTML = `
                <span>${medal} ${entry.name}</span>
                <span style="color:var(--accent);">${entry.score} / ${entry.total}</span>
            `;
            listDiv.appendChild(div);
        });
    }

    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('rankScreen').classList.remove('hidden');
}
