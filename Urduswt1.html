<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اردو ایم سی کیو کوئز - 12th Bihar Board (Part 2)</title>
    
    <!-- Good Urdu Font: Noto Nastaliq Urdu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --red: #e74c3c;
            --red-hover: #c0392b;
            --green: #27ae60;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --wrong-bg: #f8d7da;
            --wrong-border: #f5c6cb;
        }

        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            line-height: 2.2;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: var(--white);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background: #f0f0f0;
        }

        .option-label input[type="radio"] {
            margin-left: 15px;
            transform: scale(1.3);
            cursor: pointer;
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            background-color: var(--red);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background-color: var(--red-hover);
        }

        /* Score Display */
        .score-container {
            display: none;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--green);
            margin-top: 25px;
            padding: 20px;
            border: 2px solid var(--green);
            border-radius: 10px;
            background-color: #e8f8f5;
        }

        /* Correct/Incorrect Highlights after submit */
        .correct-ans {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            font-weight: bold;
        }

        .wrong-ans {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
        }

        /* Disabled state */
        input[type="radio"]:disabled {
            cursor: not-allowed;
        }
        .disabled-label {
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>

        const quizContainer = document.getElementById('quiz-container');
        const submitBtn = document.getElementById('submit-btn');
        const scoreDisplay = document.getElementById('score-display');
        const scoreValue = document.getElementById('score-value');
        const totalQuestionsSpan = document.getElementById('total-questions');

        // Set total questions
        totalQuestionsSpan.innerText = quizData.length;

        // Function to render all questions
        function loadQuiz() {
            let output = '';
            quizData.forEach((currentQuestion, questionIndex) => {
                output += `
                    <div class="question-card" id="q-card-${questionIndex}">
                        <div class="question-text">${questionIndex + 1}. ${currentQuestion.q}</div>
                        <div class="options">
                `;
                currentQuestion.options.forEach((option, optionIndex) => {
                    output += `
                        <label class="option-label" id="label-${questionIndex}-${optionIndex}">
                            <input type="radio" name="question${questionIndex}" value="${optionIndex}">
                            ${option}
                        </label>
                    `;
                });
                output += `
                        </div>
                    </div>
                `;
            });
            quizContainer.innerHTML = output;
        }

        // Function to handle Submit
        submitBtn.addEventListener('click', () => {
            let score = 0;
            
            quizData.forEach((currentQuestion, questionIndex) => {
                const selectedOption = document.querySelector(`input[name="question${questionIndex}"]:checked`);
                
                // Get all labels for this question
                const labels = document.querySelectorAll(`#q-card-${questionIndex} .option-label`);
                const inputs = document.querySelectorAll(`input[name="question${questionIndex}"]`);

                // Disable all inputs after submit
                inputs.forEach(input => input.disabled = true);
                labels.forEach(label => label.classList.add('disabled-label'));

                // Highlight the correct answer always
                labels[currentQuestion.correct].classList.add('correct-ans');

                if (selectedOption) {
                    if (parseInt(selectedOption.value) === currentQuestion.correct) {
                        score++;
                    } else {
                        // Highlight the wrong answer chosen by user
                        labels[parseInt(selectedOption.value)].classList.add('wrong-ans');
                    }
                }
            });

            // Show score in Green
            scoreDisplay.style.display = 'block';
            scoreValue.innerText = score;
            
            // Change button state
            submitBtn.innerText = "دوبارہ کوشش کریں (Reload to Try Again)";
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = "#95a5a6"; // Grey out button
        });

        // Initialize Quiz
        loadQuiz();
    </script>
